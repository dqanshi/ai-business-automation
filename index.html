<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="home.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->
<header class="navbar">
  <div class="nav-container">

    <!-- Left spacer -->
    <div></div>

    <!-- Center Logo -->
    <a href="index.html" class="logo">
      <span class="brand-accent">Automate</span><span>Scale</span>
    </a>

    <!-- Right side -->
    <div class="nav-right">
      <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>

      <button id="darkToggle" class="theme-btn">🌙</button>
    </div>

  </div>
</header>


<!-- ================= HERO ================= -->
<section class="hero">
  <div class="container hero-inner">
    <h1>AI & Automation Insights That Actually Work</h1>
    <p>Practical guides, real systems, and scalable automation strategies.</p>
  </div>
</section>

<section class="container ad-top">
  <div class="ad-box">Advertisement</div>
</section>


<!-- ================= MAIN GRID ================= -->
<section class="container main-grid">

  <main>
    <h2 class="section-title">Latest Articles</h2>

    <div class="posts-grid">

      <div class="card">
        <h3>Test</h3>

</section>

<footer class="footer">

<!-- ================= DARK MODE SCRIPT ================= -->
<script>
const toggle = document.getElementById("darkToggle");

if(localStorage.getItem("darkMode")==="true"){
  document.body.classList.add("dark");
}

toggle.addEventListener("click",()=>{
  document.body.classList.toggle("dark");
  localStorage.setItem("darkMode",
    document.body.classList.contains("dark")
  );
});
</script>

</body>
