<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | AutomateScale</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/home.css">
</head>

<body>

<header class="navbar">
  <div class="nav-container">
    <a href="index.html" class="logo">
      <span class="brand-accent">Automate</span>Scale
    </a>
  </div>
</header>

<section class="container contact-wrapper">

  <div class="contact-card">

    <h1>Let’s Work Together</h1>
    <p class="contact-sub">
      Business inquiries, partnerships, or collaborations —
      send a message below.
    </p>

    <form class="contact-form">

      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea rows="5" placeholder="Your Message" required></textarea>

      <button type="submit">Send Message</button>

    </form>

  </div>

<div class="social-buttons">
  <a href="https://twitter.com/YOUR_USERNAME" target="_blank" class="social-btn">Twitter</a>
  <a href="https://youtube.com/@YOUR_CHANNEL" target="_blank" class="social-btn">YouTube</a>
  <a href="https://github.com/YOUR_USERNAME" target="_blank" class="social-btn">GitHub</a>
  <a href="https://facebook.com/YOUR_PAGE" target="_blank" class="social-btn">Facebook</a>
  <a href="https://instagram.com/YOUR_USERNAME" target="_blank" class="social-btn">Instagram</a>
</div>

</section>

<footer class="footer">
  <div class="footer-links">
    <a href="about.html">About</a> |
    <a href="contact.html">Contact</a> |
    <a href="privacy.html">Privacy</a>
  </div>
  <p>© 2026 AutomateScale</p>
</footer>

</body>
</html>
