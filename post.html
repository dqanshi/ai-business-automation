<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="pageTitle">Post | AutomateScale</title>

<link rel="stylesheet" href="css/post.css">

<script defer src="js/base.js"></script>
<script type="module" src="js/post.js"></script>

</head>
<body>

<!-- ================= NAVBAR ================= -->
<header class="navbar">
  <div class="nav-container">

    <div class="nav-left"></div>

    <div class="logo-wrapper">
      <a href="index.html" class="logo">
        <span class="brand-accent">Automate</span><span>Scale</span>
      </a>
    </div>

    <div class="nav-right">
      <button id="darkToggle" class="theme-btn">🌙</button>
    </div>

  </div>
</header>


<!-- ================= ARTICLE ================= -->
<main class="post-wrapper">

  <article class="post-container">

    <!-- 🔥 Firebase injects here -->
    <h1 id="postTitle" class="post-title">Loading...</h1>

    <div id="postMeta" class="post-meta"></div>

    <div class="divider"></div>

    <div class="ad-box">Advertisement</div>

    <!-- 🔥 Firebase injects content here -->
    <div id="postContent" class="post-content">
      <p>Loading article...</p>
    </div>

    <div class="ad-box">Advertisement</div>

  </article>

</main>

<footer class="footer">
  <div class="footer-inner">

    <div class="footer-left">
      <a href="index.html" class="logo">
        <span class="brand-accent">Automate</span><span>Scale</span>
      </a>
    </div>

    <div class="footer-links">
      <a href="#">About</a>
      <a href="#">Contact</a>
      <a href="#">Privacy</a>
    </div>

  </div>

  <div class="footer-bottom">
    © 2026 AutomateScale
  </div>
</footer>
  

</body>
</html>
